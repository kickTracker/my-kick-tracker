name: Kick Full User Refresh (manual)

on:
  # The 3-hourly full refresh now runs INSIDE the chat worker
  # (.github/workflows/chat-collector.yml) so a single job owns the database and
  # the two workflows can never fight over the binary kick_tracker.db file.
  # This workflow stays as a manual escape hatch when you want an immediate
  # refresh of every tracked channel without waiting for the worker's 3h cycle.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-all-users:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Deliberately a separate concurrency group from the chat worker so a manual
    # click is not stuck behind a ~5.5h worker run. If it overlaps a worker push,
    # the worker recovers on its own (it re-syncs and keeps collecting).
    concurrency:
      group: kick-db-writer-refresh
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Refresh All Tracked Users
        run: npm run refresh-all

      - name: Commit and Push Fresh Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Same guard as the chat worker: GitHub rejects any push that contains a
          # file larger than 100 MiB, so compact the tracked database first.
          npm run prune || echo "[prune] maintenance reported a problem; continuing"

          OVER_LIMIT=0
          for DB_FILE in kick_tracker.db archive/*.db; do
            [ -f "$DB_FILE" ] || continue
            DB_BYTES=$(stat -c%s "$DB_FILE" 2>/dev/null || echo 0)
            echo "[push] $DB_FILE is $(( DB_BYTES / 1024 / 1024 )) MiB"
            if [ "$DB_BYTES" -ge 104857600 ]; then
              echo "Database $DB_FILE exceeds GitHub's 100 MiB per-file push limit; aborting the push."
              OVER_LIMIT=1
            fi
          done
          if [ "$OVER_LIMIT" = "1" ]; then
            echo "Aborting the push."
            exit 1
          fi

          git add -f kick_tracker.db
          git add -f archive/*.db 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to push."
            exit 0
          fi

          git commit -m "auto: full user refresh [skip ci]"

          # Safety net: if main moved while we worked, re-sync and retry.
          for attempt in 1 2 3; do
            if git push origin main; then
              break
            fi
            echo "Push rejected (attempt $attempt). Syncing with origin/main..."
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main || true
            git reset --hard FETCH_HEAD || true
            sleep 5
            if [ "$attempt" = "3" ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi
          done
